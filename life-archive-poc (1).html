<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Archive — Personal Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --green-deep:#1f3329;
  --green:#2c4a3b;
  --green-soft:#3d5c4a;
  --cream:#efe6d3;
  --cream-2:#e6dabf;
  --wood:#5a3a26;
  --wood-dark:#3c2717;
  --gold:#c6a15b;
  --gold-bright:#dab86e;
  --ink:#221a12;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(198,161,91,0.08), transparent 40%),
    var(--cream);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

/* ---------- Header ---------- */
.topbar{
  background:linear-gradient(180deg,var(--green-deep),var(--green));
  color:var(--cream);
  padding:22px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:4px solid var(--gold);
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
}
.brand{display:flex;align-items:center;gap:14px;}
.crest{
  width:42px;height:42px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:16px;
  color:var(--gold-bright);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), transparent 60%);
}
.brand h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:0.5px;margin:0;
}
.brand span{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:3px;
  color:var(--gold-bright);text-transform:uppercase;margin-top:2px;
}
.new-entry-btn{
  background:var(--gold);color:var(--green-deep);border:none;
  font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;padding:12px 20px;border-radius:2px;cursor:pointer;
  transition:all .15s ease;
}
.new-entry-btn:hover{background:var(--gold-bright);transform:translateY(-1px);}

/* ---------- Layout ---------- */
.layout{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 86px);}

/* ---------- Sidebar (ledger spine) ---------- */
.sidebar{
  width:200px;flex-shrink:0;
  background:linear-gradient(180deg,var(--wood),var(--wood-dark));
  padding:24px 0;
  box-shadow:4px 0 14px rgba(0,0,0,0.15);
}
.month-tab{
  color:rgba(239,230,211,0.6);
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;
  padding:13px 24px;cursor:pointer;border-left:3px solid transparent;
  display:flex;justify-content:space-between;align-items:center;
  transition:all .15s ease;
}
.month-tab:hover{color:var(--cream);background:rgba(255,255,255,0.03);}
.month-tab.active{
  color:var(--gold-bright);border-left:3px solid var(--gold);
  background:rgba(0,0,0,0.15);font-weight:500;
}
.month-tab .count{
  font-size:10px;background:rgba(198,161,91,0.2);border-radius:8px;
  padding:1px 7px;color:var(--gold-bright);
}

/* ---------- Main ---------- */
.main{flex:1;padding:36px 40px;}
.month-header{
  display:flex;align-items:baseline;gap:16px;margin-bottom:28px;
  border-bottom:2px solid var(--wood);padding-bottom:16px;
}
.month-header h2{
  font-family:'Fraunces',serif;font-weight:600;font-size:34px;margin:0;color:var(--green-deep);
}
.month-header .sub{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--wood);
}

.empty-state{
  text-align:center;padding:80px 20px;color:var(--wood);
  font-family:'Fraunces',serif;font-style:italic;font-size:18px;opacity:0.7;
}

.entry-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;
}
.card{
  background:var(--cream-2);border:1px solid rgba(90,58,38,0.25);
  border-radius:3px;overflow:hidden;position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,0.15);}
.card .cover{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
  background:linear-gradient(135deg,var(--green-soft),var(--green-deep));
}
.card .cover.book{aspect-ratio:2/3;}
.type-flag{
  position:absolute;top:8px;left:8px;background:var(--green-deep);color:var(--gold-bright);
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;border:1px solid var(--gold);
}
.card .info{padding:12px 12px 14px;}
.card .title{
  font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;line-height:1.25;
  color:var(--ink);margin:0 0 3px;
}
.card .subtitle{
  font-size:11.5px;color:var(--wood);margin:0 0 8px;font-style:italic;
}
.card .rating{color:var(--gold);font-size:12px;letter-spacing:1px;}
.card .notes{
  font-size:11px;color:#5c5142;margin-top:6px;line-height:1.4;
  border-top:1px dashed rgba(90,58,38,0.3);padding-top:6px;
}
.card.photo .cover{object-fit:cover;filter:sepia(0.12) contrast(1.03);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(31,51,41,0.55);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--cream);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  border-radius:4px;border:3px solid var(--green-deep);box-shadow:0 20px 50px rgba(0,0,0,0.4);
}
.modal-head{
  background:var(--green-deep);color:var(--cream);padding:16px 22px;
  display:flex;justify-content:space-between;align-items:center;
}
.modal-head h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0;}
.modal-head button{background:none;border:none;color:var(--gold-bright);font-size:20px;cursor:pointer;}
.modal-body{padding:22px;}

.type-picker{display:flex;gap:8px;margin-bottom:18px;}
.type-btn{
  flex:1;padding:10px 4px;text-align:center;border:1.5px solid var(--wood);border-radius:3px;
  background:transparent;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--wood);transition:all .15s;
}
.type-btn.active{background:var(--green-deep);color:var(--gold-bright);border-color:var(--green-deep);}

.search-row{display:flex;gap:8px;margin-bottom:12px;}
.search-row input{flex:1;}
input,textarea,select{
  width:100%;padding:9px 11px;border:1px solid rgba(90,58,38,0.4);border-radius:2px;
  font-family:'Inter',sans-serif;font-size:13px;background:#fbf7ec;color:var(--ink);
}
.search-btn{
  background:var(--wood);color:var(--cream);border:none;padding:0 16px;border-radius:2px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
}
.results{max-height:220px;overflow-y:auto;margin-bottom:14px;border:1px solid rgba(90,58,38,0.2);border-radius:3px;}
.result-item{
  display:flex;gap:10px;padding:8px 10px;cursor:pointer;align-items:center;
  border-bottom:1px solid rgba(90,58,38,0.12);
}
.result-item:hover{background:var(--cream-2);}
.result-item img{width:34px;height:34px;object-fit:cover;border-radius:2px;background:var(--green-soft);}
.result-item .r-title{font-size:12.5px;font-weight:600;}
.result-item .r-sub{font-size:11px;color:var(--wood);}

.selected-preview{
  display:flex;gap:12px;background:var(--cream-2);padding:10px;border-radius:3px;margin-bottom:14px;
  border:1px solid var(--gold);
}
.selected-preview img{width:52px;height:52px;object-fit:cover;border-radius:2px;}

.field{margin-bottom:12px;}
.field label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--wood);margin-bottom:5px;
}
.star-row{display:flex;gap:4px;}
.star{font-size:22px;color:#ccc;cursor:pointer;}
.star.filled{color:var(--gold);}
.save-btn{
  width:100%;background:var(--green-deep);color:var(--gold-bright);border:none;padding:13px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;
  border-radius:2px;cursor:pointer;margin-top:6px;
}
.save-btn:hover{background:var(--green);}
.save-btn:disabled{opacity:0.4;cursor:not-allowed;}
.loading-txt{font-size:11px;color:var(--wood);font-style:italic;padding:8px 0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="crest">TA</div>
    <div>
      <h1>The Archive</h1>
      <span>Est. 2026 &middot; A Record of Consumption</span>
    </div>
  </div>
  <button class="new-entry-btn" onclick="openModal()">+ New Entry</button>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="month-header">
      <h2 id="monthTitle">—</h2>
      <span class="sub" id="monthSub">0 entries</span>
    </div>
    <div id="entryArea"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Log a New Entry</h3>
      <button onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="type-picker" id="typePicker">
        <button class="type-btn active" data-type="book">Book</button>
        <button class="type-btn" data-type="album">Album</button>
        <button class="type-btn" data-type="film">Film</button>
        <button class="type-btn" data-type="photo">Photo</button>
      </div>

      <div id="searchSection">
        <div class="search-row">
          <input id="searchInput" placeholder="Search by title..." />
          <button class="search-btn" onclick="doSearch()">Search</button>
        </div>
        <div class="results" id="results" style="display:none;"></div>
      </div>

      <div id="photoSection" style="display:none;">
        <div class="field">
          <label>Upload Photo</label>
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)" />
        </div>
      </div>

      <div id="selectedPreview" style="display:none;"></div>

      <div class="field">
        <label>Title</label>
        <input id="fieldTitle" placeholder="Title" />
      </div>
      <div class="field">
        <label>Author / Artist / Director</label>
        <input id="fieldSubtitle" placeholder="—" />
      </div>
      <div class="field">
        <label>Month</label>
        <input type="month" id="fieldMonth" />
      </div>
      <div class="field">
        <label>Rating</label>
        <div class="star-row" id="starRow"></div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="fieldNotes" rows="3" placeholder="A line or two..."></textarea>
      </div>
      <button class="save-btn" onclick="saveEntry()">Add to Archive</button>
    </div>
  </div>
</div>

<script>
let entries = [];
let currentType = 'book';
let selectedCover = '';
let currentRating = 0;
let activeMonth = null;
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES[parseInt(m)-1] + ' ' + y;
}

const STORAGE_KEY = 'the-archive-entries';

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
  if(!activeMonth) activeMonth = monthKey(new Date());
  render();
}

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  catch(e){ console.error('storage failed — your browser storage may be full or blocked', e); alert('Could not save. Your browser storage may be full (large photo uploads count against it).'); }
}

function render(){
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  const months = {};
  entries.forEach(e => { months[e.month] = (months[e.month]||0) + 1; });
  if(!months[activeMonth]) months[activeMonth] = months[activeMonth] || 0;
  const keys = Object.keys(months).sort().reverse();
  if(keys.length === 0) keys.push(activeMonth);

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = keys.map(k => `
    <div class="month-tab ${k===activeMonth?'active':''}" onclick="selectMonth('${k}')">
      <span>${monthLabel(k)}</span>
      <span class="count">${months[k]||0}</span>
    </div>
  `).join('');
}

function selectMonth(k){ activeMonth = k; render(); }

function renderMain(){
  document.getElementById('monthTitle').textContent = monthLabel(activeMonth);
  const monthEntries = entries.filter(e => e.month === activeMonth);
  document.getElementById('monthSub').textContent = monthEntries.length + ' entr' + (monthEntries.length===1?'y':'ies') + ' logged';

  const area = document.getElementById('entryArea');
  if(monthEntries.length === 0){
    area.innerHTML = `<div class="empty-state">Nothing archived this month yet.</div>`;
    return;
  }
  area.innerHTML = `<div class="entry-grid">` + monthEntries.map(e => `
    <div class="card ${e.type}">
      <div class="type-flag">${e.type}</div>
      ${e.cover ? `<img class="cover ${e.type==='book'?'book':''}" src="${e.cover}" />` : `<div class="cover ${e.type==='book'?'book':''}"></div>`}
      <div class="info">
        <p class="title">${escapeHtml(e.title)}</p>
        ${e.subtitle ? `<p class="subtitle">${escapeHtml(e.subtitle)}</p>` : ''}
        ${e.rating ? `<div class="rating">${'★'.repeat(e.rating)}${'☆'.repeat(5-e.rating)}</div>` : ''}
        ${e.notes ? `<p class="notes">${escapeHtml(e.notes)}</p>` : ''}
      </div>
    </div>
  `).join('') + `</div>`;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}

/* ---------- Modal ---------- */
function openModal(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('fieldMonth').value = activeMonth;
  resetSelection();
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

document.getElementById('typePicker').addEventListener('click', (e) => {
  const btn = e.target.closest('.type-btn');
  if(!btn) return;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
  resetSelection();
  document.getElementById('searchSection').style.display = currentType === 'photo' ? 'none' : 'block';
  document.getElementById('photoSection').style.display = currentType === 'photo' ? 'block' : 'none';
});

function resetSelection(){
  selectedCover = '';
  currentRating = 0;
  document.getElementById('searchInput').value = '';
  document.getElementById('fieldTitle').value = '';
  document.getElementById('fieldSubtitle').value = '';
  document.getElementById('fieldNotes').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('selectedPreview').style.display = 'none';
  renderStars();
}

function renderStars(){
  const row = document.getElementById('starRow');
  row.innerHTML = '';
  for(let i=1;i<=5;i++){
    const s = document.createElement('span');
    s.className = 'star' + (i<=currentRating?' filled':'');
    s.textContent = '★';
    s.onclick = () => { currentRating = i; renderStars(); };
    row.appendChild(s);
  }
}
renderStars();

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  const results = document.getElementById('results');
  results.style.display = 'block';
  results.innerHTML = `<div class="loading-txt">Searching...</div>`;

  try{
    let items = [];
    if(currentType === 'book'){
      const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8`);
      const data = await r.json();
      items = (data.docs||[]).map(d => ({
        title: d.title,
        subtitle: d.author_name ? d.author_name[0] : '',
        cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : ''
      }));
    } else if(currentType === 'album'){
      const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=album&limit=8`);
      const data = await r.json();
      items = (data.results||[]).map(d => ({
        title: d.collectionName,
        subtitle: d.artistName,
        cover: d.artworkUrl100 ? d.artworkUrl100.replace('100x100','400x400') : ''
      }));
    } else if(currentType === 'film'){
      const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=movie&limit=8`);
      const data = await r.json();
      items = (data.results||[]).map(d => ({
        title: d.trackName,
        subtitle: d.artistName || (d.releaseDate ? d.releaseDate.slice(0,4) : ''),
        cover: d.artworkUrl100 ? d.artworkUrl100.replace('100x100','400x400') : ''
      }));
    }

    if(items.length === 0){
      results.innerHTML = `<div class="loading-txt">No results. Try a different search.</div>`;
      return;
    }
    results.innerHTML = items.map((it,idx) => `
      <div class="result-item" onclick='pickResult(${JSON.stringify(it).replace(/'/g,"&apos;")})'>
        ${it.cover ? `<img src="${it.cover}"/>` : `<img/>`}
        <div>
          <div class="r-title">${escapeHtml(it.title||'')}</div>
          <div class="r-sub">${escapeHtml(it.subtitle||'')}</div>
        </div>
      </div>
    `).join('');
  }catch(err){
    results.innerHTML = `<div class="loading-txt">Search failed — check connection.</div>`;
  }
}

function pickResult(item){
  selectedCover = item.cover || '';
  document.getElementById('fieldTitle').value = item.title || '';
  document.getElementById('fieldSubtitle').value = item.subtitle || '';
  const preview = document.getElementById('selectedPreview');
  preview.style.display = 'flex';
  preview.innerHTML = (item.cover ? `<img src="${item.cover}"/>` : '') + `<div><strong>${escapeHtml(item.title||'')}</strong><br><span style="font-size:11px;color:var(--wood);">${escapeHtml(item.subtitle||'')}</span></div>`;
}

function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    selectedCover = ev.target.result;
    const preview = document.getElementById('selectedPreview');
    preview.style.display = 'flex';
    preview.innerHTML = `<img src="${selectedCover}"/><div><strong>Photo attached</strong></div>`;
    if(!document.getElementById('fieldTitle').value) document.getElementById('fieldTitle').value = file.name.replace(/\.[^/.]+$/,'');
  };
  reader.readAsDataURL(file);
}

async function saveEntry(){
  const title = document.getElementById('fieldTitle').value.trim();
  const month = document.getElementById('fieldMonth').value;
  if(!title || !month){ alert('Please add a title and month.'); return; }

  entries.push({
    id: Date.now().toString(),
    type: currentType,
    title,
    subtitle: document.getElementById('fieldSubtitle').value.trim(),
    notes: document.getElementById('fieldNotes').value.trim(),
    rating: currentRating,
    cover: selectedCover,
    month
  });
  persist();
  activeMonth = month;
  closeModal();
  render();
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});

loadEntries();
</script>
</body>
</html>
